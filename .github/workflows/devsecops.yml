name: DevSecOps
on:
  pull_request:
    branches: [main, test]
  push:
    branches: [main, test]
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check tracked secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then exit 1; fi
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{12,}|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----' -- ':!*.md' ':!.github/workflows/devsecops.yml'; then exit 1; fi
  sast:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
  browser:
    needs: [quality, database]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated Supabase stack and apply migrations
        run: npx supabase start --exclude realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /dev/null
      - name: Create temporary local test accounts
        run: node scripts/seed-local-e2e.mjs
      - run: npm run build
      - run: npm run test:e2e
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated Supabase stack and apply migrations
        run: npx supabase start --exclude realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /dev/null
      - name: Verify ownership and municipal RLS
        run: docker exec -i supabase_db_HuellaLimpia psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/rls.sql
      - name: Require clean database security advisors
        run: npx supabase db advisors --type security --level warn --fail-on warn
  gate:
    if: always()
    needs: [quality, security, sast, browser, database]
    runs-on: ubuntu-latest
    steps:
      - name: Require mandatory checks
        run: |
          test '${{ needs.quality.result }}' = success
          test '${{ needs.security.result }}' = success
          test '${{ needs.sast.result }}' = success
          test '${{ needs.browser.result }}' = success
          test '${{ needs.database.result }}' = success
